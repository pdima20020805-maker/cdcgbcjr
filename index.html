<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Site</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

  <audio id="bgMusic" loop>
    <source src="718497d1b966f60.mp3" type="audio/mpeg">
</audio>

<!-- БЛОК 1 -->
<section class="start-screen" id="startScreen">

  <img class="start-img" src="img/1.png" alt="">

  <button class="start-btn" id="startBtn" type="button">
    <img src="img/2.png" alt="Открыть приглашение">
  </button>

</section>


<div class="site-content" id="siteContent">
 <!-- БЛОК 2 -->
<section class="block2 reveal">
    <img class="block2-img" id="guestImage" src="img/3.png" alt="">
</section>

  <!-- БЛОК 3 -->
<section class="block3">

    <img class="block3-img reveal" src="img/4.png" alt="">

    <div class="timer">

        <div class="timer-item">
            <span id="days">00</span>
            <p>дней</p>
        </div>

        <div class="timer-item">
            <span id="hours">00</span>
            <p>часов</p>
        </div>

        <div class="timer-item">
            <span id="minutes">00</span>
            <p>минут</p>
        </div>

        <div class="timer-item">
            <span id="seconds">00</span>
            <p>секунд</p>
        </div>

    </div>

</section>

<!-- БЛОК 4 -->
<section class="block4 reveal">

    <img class="block4-img" src="img/5.png" alt="">

    <div class="block4-map">

        <img class="block4-img" src="img/6.png" alt="">

        <a class="block4-btn" href="https://yandex.ru/maps/org/belyye_nochi/196127068636/?ll=55.099778%2C51.755446&z=14.96">
            <img src="img/7.png" alt="">
        </a>

    </div>

</section>

<!-- БЛОК 5 -->
<section class="block5 reveal">

    <img class="block5-img" src="img/8.png" alt="">

</section>


<!-- БЛОК 6 -->
<section class="block6 reveal">

    <img class="block6-img" src="img/9.png" alt="">

</section>

</div>

<script src="guests.js"></script>
<script src="script.js"></script>
</body>
